<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    main {
      padding: 16px;
    }

    .main-header {
      width: 100%;
      background-color: #c4af52;
      padding: 32px 16px;
    }

    .main-header__nav {
      height: 100%;
      display: flex;
      align-items: center;
    }

    .main-header__item-list {
      list-style: none;
      display: flex;
    }

    .main-header__item {
      margin-right: 8px;
    }

    .main-header__item a {
      text-decoration: none;
      color: #fff;
    }

    .main-header__item a:hover,
    .main-header__item a:active,
    .main-header__item a.active {
      color: #3b5557;
    }

    .form-control {
      margin: 8px 0;
    }

    .form-control label,
    .form-control input {
      display: block;
    }

    .form-control input {
      border: 1px solid #c4af52;
      font: inherit;
      border-radius: 2px;
    }

    button {
      padding: 2px 4px;
      font: inherit;
      border: 1px solid #3b5557;
      color: #3b5557;
      background-color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover,
    button:active {
      background-color: #3b5557;
      color: #fff;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <nav class="main-header__nav">
      <ul class="main-header__item-list">
        <li class="main-header__item"><a href="/">Shop</a></li>
        <li class="main-header__item"><a class="active" href="/admin/add-product">Add Product</a></li>
      </ul>
    </nav>
  </header>
  <h2>Page not found</h2>
</body>
</html>
